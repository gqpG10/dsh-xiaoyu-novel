# relations.yml —— 人物关系（顶层数组，每条关系一条；a/b 用角色卡 slug）
# 字段：
#   a / b        双方角色卡 slug（characters/ 目录名）
#   type         关系类型（师徒/宿敌/恋人/同门……自定）
#   description  一句话说明这段关系的张力所在
#   intensity    关系强度 1-5
#   started      关系开始的章节号（如 v01-c003）
#   ended        结束章节号，未结束留空 ""
# 可选字段（0.9.0，不写＝旧行为）：
#   direction    a-to-b | b-to-a | both      缺省 both（图上不画箭头）
#   phase        past | now | potential     缺省 now（past 虚化 / potential 点划）
#   tags         [内线, 递刀]                自由标签，只用于面板搜索
#   stages       多阶段记录，按章节取"≤ 当前章的最后一个阶段"：
#                - chapter: v01-c003
#                  type: 雇佣
#                  intensity: 2
#                  phase: now
#                  description: 刚招进来，纯上下级
[]
