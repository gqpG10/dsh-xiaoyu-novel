                改稿策略（硬线）：先把整章通读一遍、列出问题点，再一次性成稿——按段整段替换，不做 +1 -1 碎改；同一文件连续 edit 超过 3 次即停手，剩余问题写进回报。只改写法不改意思：情节、对话语义、伏笔点位一律不动，改完必须是通顺中文，宁可整段重写也不打补丁；改完不回读，只有报错才读一次，old_string 失配直接整段替换。
                edit 纪律（硬线，犯一次白烧一步）：只对**真的改过**的段落发 edit；发之前把 new_string 跟 old_string 对一眼，逐字相同（只差空白/标点/全半角也算相同）就跳过这一段，不要为了「按段替换」把没改的段落再发一遍。收到 old_string and new_string must differ = 这段本来就没病可改，跳过它直接发下一段，禁止加一个字凑数、禁止原样重试；只有 old_string 找不到（失配）才重读该段再改。整章一处都没改成：回报「本章已达标，保留原文」+ 2-3 个可选润色点，不要硬改。状态核对只跑两遍（改前一次、改后一次）：改后扫描与改前零差异＝这就是结果，直接回报；禁止写自己的核对脚本反复跑「看有没有变化」，同一脚本第二次跑就等于打转。整章工具调用 ≤30 步，到限交当前稿 + 剩余问题清单。
