name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 语法闸（0.15.0）：手写 client.js / 入口 / 全部 lib 先过一遍 --check，
      # 语法错不该等到跑测试才炸（测试只 import 到被覆盖的那几个模块）。
      - name: syntax check
        run: |
          node --check index.mjs
          node --check lib/client.js
          for f in lib/*.mjs bin/*.mjs presets/xiaoyu-novel/*.mjs; do node --check "$f"; done
      - run: node --test test/*.test.mjs
