<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>小鱼创作台</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#101114;color:#e9eaec;
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%}
  .bar{position:sticky;top:0;z-index:30;background:#171a1f;border-bottom:1px solid #33373f;
    padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .brand{font-size:15px;font-weight:700;white-space:nowrap}
  .badge{font-size:11px;color:#8d939c;border:1px solid #474d56;border-radius:999px;padding:0 7px;white-space:nowrap}
  .grow{flex:1 1 auto}
  select,button,input,textarea{font:inherit;font-size:13px;color:#e9eaec;background:#23262c;border:1px solid #3d424a;
    border-radius:8px;padding:5px 9px;min-height:32px}
  button:active{background:#2e333a}
  button.pri{background:#4b8bf5;border-color:#4b8bf5;color:#fff}
  button.warn{background:#8a3b3b;border-color:#8a3b3b;color:#fff}
  button.sm{min-height:26px;padding:2px 8px;font-size:12px}
  select{max-width:46vw}
  nav.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px;border-bottom:1px solid #33373f;background:#15181c}
  nav.tabs button{background:transparent;border:none;color:#b9bdc4;min-height:30px;padding:4px 9px}
  nav.tabs button[aria-current="true"]{color:#fff;background:#2e333a;border-radius:8px}
  main{padding:10px}
  .card{background:#1d1f24;border:1px solid #34383f;border-radius:12px;padding:12px;margin:0 0 10px}
  .card h3{margin:0 0 8px;font-size:14px;color:#b9bdc4;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;padding:5px 0;border-bottom:1px solid #24272d}
  .row:last-child{border-bottom:none}
  .k{color:#8d939c;font-size:12px;min-width:4.6em;flex:none}
  .v{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
  .muted{color:#8d939c;font-size:12.5px}
  .pill{display:inline-block;font-size:11px;border:1px solid #474d56;border-radius:999px;padding:0 6px;margin-left:5px;color:#b9bdc4;white-space:nowrap}
  .pill.good{color:#3fbf7f;border-color:#2c6b4f}
  .pill.bad{color:#ff8f8f;border-color:#7a3a3a}
  .pill.mid{color:#e5c063;border-color:#6f5c2a}
  .chap{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:transparent;border:none;
    border-bottom:1px solid #24272d;border-radius:0;padding:9px 4px;color:#e9eaec;min-height:42px}
  .chap .no{color:#8d939c;font-size:12px;flex:none;min-width:3.2em}
  .chap .ti{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
  .chap .w{color:#8d939c;font-size:11px;flex:none}
  .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.85;background:#1d1f24;
    border:1px solid #34383f;border-radius:12px;padding:14px}
  textarea.editor{width:100%;min-height:46vh;font-size:15px;line-height:1.8;padding:12px;white-space:pre-wrap;resize:vertical}
  textarea.small{min-height:180px;font-size:13px}
  .err{background:#2a1a1c;border:1px solid #ef5b5b;color:#ffb4b4;border-radius:10px;padding:10px 12px;margin:0 0 10px}
  .ok{color:#3fbf7f}
  .note{font-size:12px;color:#8d939c;padding:4px 2px;min-height:18px}
  .score{font-size:22px;font-weight:700}
  .flagrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #24272d}
  .flagrow .fx{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-size:13px}
  a{color:#6fa8ff}
  canvas{width:100%;border:1px solid #34383f;border-radius:12px;background:#14161a;touch-action:manipulation}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .cbody{max-height:62vh;overflow-y:auto}
  .foldbtn{margin-left:auto;background:transparent;border:none;color:#8d939c;min-height:22px;padding:0 6px;font-size:12px;flex:none}
  .ln{min-height:1.2em}
  .ln.hl{background:#3d3410;border-radius:4px}
  .diffdel{color:#ff9d9d;background:#2a1a1c;border-radius:4px;padding:0 4px;display:block}
  .diffadd{color:#7fe0a8;background:#15291c;border-radius:4px;padding:0 4px;display:block}
  .lane{position:relative;height:26px;border-bottom:1px solid #24272d}
  .lane .lanebar{position:absolute;top:9px;height:8px;border-radius:4px;background:#4b8bf5}
  .lane .lanedot{position:absolute;top:6px;width:14px;height:14px;border-radius:50%;background:#e5a063;border:2px solid #10181c}
  .heatrow{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #24272d}
  .heatbar{height:10px;border-radius:5px;background:#4b8bf5;min-width:2px}
  .goalbar{height:12px;border-radius:6px;background:#2e333a;overflow:hidden;flex:1 1 auto}
  .floatnav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:8px;
    background:#171a1f;border:1px solid #3d424a;border-radius:999px;padding:6px 12px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
  body.light .floatnav{background:#fff}
  .weekbars{display:flex;align-items:flex-end;gap:3px;height:64px;margin:4px 0}
  .weekbars>div{flex:1 1 0;min-width:3px;background:#4b8bf5;border-radius:3px 3px 0 0}
  .updwrap{display:flex;gap:8px;align-items:center;flex:1 1 auto;min-width:180px}
  .updbar{height:8px;border-radius:5px;background:#2e333a;overflow:hidden;flex:1 1 auto}
  .updbar>div{height:100%;width:0;background:#4b8bf5;transition:width .4s}
  .goalbar>div{height:100%;background:#3fbf7f}
  .wsbtn{display:block;width:100%;text-align:left;background:transparent;border:1px solid #34383f;border-radius:10px;padding:10px 12px;margin-bottom:8px;color:#e9eaec}
  .wsbtn.cur{border-color:#4b8bf5;background:#1a2637}
  .todorow{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #24272d}
  body.light{background:#f3f4f7;color:#22252a}
  body.light .bar,body.light nav.tabs{background:#fff;border-color:#e2e4e9}
  body.light .card{background:#fff;border-color:#e2e4e9}
  body.light .muted,body.light .k,body.light .badge{color:#6a7078}
  body.light select,body.light button,body.light input,body.light textarea{background:#eceef2;border-color:#d5d8de;color:#22252a}
  body.light .body,body.light canvas{background:#fafbfc}
  body.light nav.tabs button{color:#565c66}
  body.light nav.tabs button[aria-current="true"]{color:#111;background:#e6e9ef}
  /* ── 3.14.0 时间线：垂直轴 + 发光节点 + 折叠卡片 ── */
  .tl{position:relative;margin:10px 0 4px 10px;padding-left:24px;border-left:2px solid #26324a}
  .tlItem{position:relative;margin:12px 0;padding:10px 12px;background:#161b26;border:1px solid #232c3c;border-radius:10px}
  .tlItem:before{content:"";position:absolute;left:-31px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--tc,#5cc9ff);box-shadow:0 0 0 3px #131720,0 0 9px var(--tc,#5cc9ff)}
  .tlDay{font-weight:700;color:#e8ecf3;font-size:13.5px}
  .tlTitle{color:#c8d2e0;font-size:13px;margin-top:3px;line-height:1.55}
  .tlMeta{display:flex;gap:8px;align-items:center;margin-top:5px}
  .tlDesc{color:#8b93a3;font-size:12px;line-height:1.6;margin-top:5px;max-height:44px;overflow:hidden;transition:max-height .3s}
  .tlDesc.open{max-height:2000px}
  .tlMore{color:#5d8ecf;font-size:11.5px;background:none;border:none;padding:2px 0;cursor:pointer;text-align:left;display:block}
  .tlVol{margin:16px 0 6px;padding:6px 12px;background:#1a2233;border-radius:8px;font-weight:700;color:#dbe4f0;font-size:13.5px;display:flex;gap:8px;align-items:center}</style></head>
<body>

<div class="bar">
  <span class="brand">小鱼创作台</span>
  <span class="badge" id="build" title="本页面自身的构建版本（不来自接口）">独立版</span>
  <select id="ws" aria-label="工作区"></select>
  <span class="grow"></span>
  <button id="btnReload" type="button">刷新</button>
  <button id="btnCheck" type="button">检测更新</button>
  <button id="btnTheme" type="button">主题</button>
  <button id="btnDiag" type="button" class="pri">自检</button>
  <span id="upmsg" style="font-size:11.5px;color:#8d939c;flex:1 1 100%;min-width:0;overflow-wrap:anywhere"></span>
</div>

<nav class="tabs" id="tabs"></nav>
<main id="view"><div class="note">正在读取…</div></main>
<div id="offline" style="display:none;position:sticky;top:52px;z-index:35;background:#3d3410;color:#e5c063;font-size:12px;padding:4px 10px;text-align:center">离线模式：显示的是缓存数据</div>
<div id="note" class="note"></div>

<script>
var BUILD = '3.20.0';
(function () {
  'use strict';
  var API = '/api/xiaoyu-novel/';
  var TABS = [['overview','概览'],['project','项目'],['chapters','章节'],['gate','门禁'],['audit','体检'],['todo','待办'],
              ['characters','角色'],['foreshadows','伏笔'],['relations','关系'],['timeline','时间线'],
              ['world','设定'],['index','索引'],['style','风格'],
              ['search','搜索'],['tools','工具'],['history','版本']];
  var STATUS_LABEL = { pending:'待写', writing:'写作中', review:'待审', accepted:'已定稿' };
  var FORE_LABEL = { planted:'已铺垫', progressing:'推进中', resolved:'已回收', abandoned:'已放弃' };
  var PHASES = ['idea','setting','outline','writing','review','consistency','export'];
  var PHASE_LABEL = { idea:'点子', setting:'设定', outline:'大纲', writing:'写作', review:'审校', consistency:'一致性', export:'导出' };
  var MODES = ['ai-draft','co-write','author-draft'];
  var MODE_LABEL = { 'ai-draft':'AI 初稿', 'co-write':'人机合写', 'author-draft':'本人初稿' };
  var HOOK_LABEL = { question:'问句钩子', unfinished:'未完待续', turn:'转折钩子', short:'短句收束', plain:'平收（无钩）', empty:'空章' };
  var S = { ws:'', data:null, tab:'overview', reader:null, err:'', q:'',
            gates:null, gatesErr:'', gateOne:null,
            audit:null, check:null, auditBusy:false,
            style:null, presets:null,
            proj:null,
            trash:null, ledger:null, slim:null,
            git:null, gitLog:null, versionsFile:'', versions:null,
            ed:null, genEd:null, graphSel:-1, coll:{}, progress:null, setup:null, cast:null, dedupe:null, autofill:null, handoff:null, charStates:null, lclean:null, searchQ:'', searchRes:null, relChap:'', castFilter:null, matrix:null, hlLine:0, genView:null, q2:'', selMode:false, selSet:{}, trend:null, trashPrev:null, sess:null, graphZoom:1, fontScale:1, diff:null, readerPos:{}, todoDone:{}, lastPosSaved:{}, wsList:[], sprint:null, qcDone:{}, beats:null, snowOpen:false, nameGen:null, nameCat:'ming', snow:{} };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function note(t) { $('note').textContent = t || ''; }
  /* 3.15.3：确认弹窗统一走工作台样式弹层（暗幕+卡片），不再用原生 confirm。 */
  function confirmAct(msg, onOk) { askModal(msg, onOk); }
  function escRe(s) { return String(s).replace(/[\.*+?^${}()|[\]\\]/g, '\\$&'); }
  function hlText(text, q) {
    var safe = esc(text);
    if (!q) return safe;
    try { return safe.replace(new RegExp(escRe(q), 'gi'), function (m) { return '<mark style="background:#6f5c2a;color:#ffe9b0;border-radius:3px">' + m + '</mark>'; }); } catch (e) { return safe; }
  }
  /* 工作台风格的确认弹层：暗幕 + 卡片，替代原生 confirm。 */
  function askModal(msg, onOk, okLabel) {
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(6,8,10,.6);display:flex;align-items:center;justify-content:center;padding:20px';
    var card = document.createElement('div');
    card.className = 'card';
    card.style.cssText = 'max-width:420px;width:100%;margin:0';
    var body = document.createElement('div');
    body.style.cssText = 'margin:6px 0 12px;white-space:pre-wrap;font-size:14px';
    body.textContent = msg;
    var row = document.createElement('div');
    row.className = 'btnrow';
    row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;margin:0';
    var no = document.createElement('button'); no.type = 'button'; no.className = 'sm'; no.textContent = '取消';
    var yes = document.createElement('button'); yes.type = 'button'; yes.className = 'sm warn'; yes.textContent = okLabel || '确认执行';
    row.appendChild(no); row.appendChild(yes);
    card.appendChild(body); card.appendChild(row); wrap.appendChild(card);
    document.body.appendChild(wrap);
    no.addEventListener('click', function () { wrap.remove(); });
    wrap.addEventListener('click', function (ev) { if (ev.target === wrap) wrap.remove(); });
    yes.addEventListener('click', function () { wrap.remove(); onOk(); });
  }

  function get(path, params) {
    var qs = [];
    Object.keys(params || {}).forEach(function (k) {
      if (params[k] != null) qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    });
    return fetch(API + path + (qs.length ? '?' + qs.join('&') : ''))
      .then(function (r) { return r.text().then(function (t) {
        var d = null; try { d = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok) throw new Error((d && d.error) || ('HTTP ' + r.status));
        if (!d) throw new Error('返回不是 JSON（HTTP ' + r.status + '）');
        return d;
      }); });
  }
  function postJson(path, body) {
    return fetch(API + path, { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().then(function (d) {
        if (!r.ok) throw new Error((d && d.error) || ('HTTP ' + r.status));
        return d;
      }); });
  }
  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacy(text); });
    }
    return Promise.resolve(legacy(text));
  }
  function legacy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  function humanColor(g) {
    if (!g || !g.ok || typeof g.human !== 'number') return '';
    var pm = (S.gates && S.gates.passMark) || 60;
    return g.human >= pm ? 'good' : (g.human >= pm - 15 ? 'mid' : 'bad');
  }
  function wsQuery() { return { path: S.ws }; }

  function weekWords() {
    var days = (S.progress && S.progress.days) || [];
    var sum = 0;
    for (var i = Math.max(0, days.length - 7); i < days.length; i++) sum += Number(days[i].words || 0);
    var first = days.length ? days[0].words : 0;
    return (sum - first) > 0 ? '+' + (sum - first) + ' 字' : '';
  }
  function streakDays() {
    var days = (S.progress && S.progress.days) || [];
    if (!days.length) return 0;
    var n = 1;
    for (var i = days.length - 1; i > 0; i--) {
      var d1 = Date.parse(days[i].date), d0 = Date.parse(days[i - 1].date);
      if (d1 - d0 === 86400000) n += 1; else break;
    }
    return n;
  }
  /* 3.16.0 近 7 日日均与单日最佳（借鉴 open-wrimo 的统计指标）。 */
  function dailyAvg7() {
    var days = (S.progress && S.progress.days) || [];
    if (days.length < 2) return '';
    var recent = days.slice(-8, -1);
    if (!recent.length) return '';
    var sum = recent.reduce(function (a, d) { return a + Number(d.words || 0); }, 0);
    return Math.round(sum / recent.length) + ' 字/天';
  }
  function bestDay() {
    var days = (S.progress && S.progress.days) || [];
    var best = null;
    days.forEach(function (d) {
      if (d.words > 0 && (!best || d.words > best.words)) best = d;
    });
    return best ? best.words + ' 字（' + best.date + '）' : '';
  }
  function gateAvg() {
    if (!S.gates || !S.gates) return '';
    var scored = Object.keys(S.gates.gates || {}).map(function (k) { return (S.gates.gates || {})[k]; }).filter(function (g) { return g && g.ok; });
    if (!scored.length) return '';
    return String(Math.round(scored.reduce(function (a, g) { return a + g.human; }, 0) / scored.length * 10) / 10);
  }
  function weekBars() {
    var days = (S.progress && S.progress.days) || [];
    if (days.length < 2) return '';
    var max = Math.max.apply(null, days.map(function (d) { return d.words || 0; })) || 1;
    return '<div class="weekbars" title="近 ' + days.length + ' 天字数走势">' + days.map(function (d) {
      return '<div style="height:' + Math.max(4, Math.round((d.words || 0) / max * 100)) + '%" title="' + esc(d.date) + '：' + (d.words || 0) + ' 字"></div>';
    }).join('') + '</div>';
  }

  function sessRow() {
    if (!S.sess) return '';
    var mins = Math.max(0, Math.floor((Date.now() - S.sess.start) / 60000));
    var gain = (progToday() || 0) - S.sess.base;
    return '<div class="row"><span class="k">本时段</span><span class="v"><span id="sessTime">' + mins + '</span> 分钟 · +' + Math.max(0, gain) + ' 字' +
      ' <button type="button" id="sessReset" class="sm">重新计时</button></span></div>';
  }

  /* 3.17.0 写作冲刺（借鉴 obsidian-writing-studio 的 sprints）：25 分钟番茄钟，
     冲刺起点记当日字数基线，结束算这一波写了多少。纯前端计时。 */
  function sprintRow() {
    var sp = S.sprint;
    if (!sp || !sp.running) {
      return '<div class="row"><span class="k">写作冲刺</span><span class="v">' +
        '<select id="spLen" style="width:5em"><option value="15">15 分钟</option><option value="25" selected>25 分钟</option><option value="45">45 分钟</option></select>' +
        ' <button type="button" id="spStart" class="sm pri">开冲</button></span></div>';
    }
    var left = Math.max(0, Math.ceil((sp.end - Date.now()) / 1000));
    var mm = Math.floor(left / 60), ss = left % 60;
    return '<div class="row"><span class="k">冲刺中</span><span class="v"><span id="spClock" style="font-weight:700;color:#e5c063">' + mm + ':' + (ss < 10 ? '0' : '') + ss + '</span>' +
      ' <button type="button" id="spStop" class="sm warn">结束</button></span></div>';
  }
  function goalHtml() {
    var goal = 4000;
    try { goal = Number(localStorage.getItem('xiaoyu.dailyGoal')) || 4000; } catch (e) {}
    var today = Math.max(0, progToday() || 0);
    var pct = Math.min(100, Math.round(today / goal * 100));
    return sessRow() + sprintRow() + '<div class="row"><span class="k">日更目标</span><span class="v" style="display:flex;gap:8px;align-items:center">' +
      '<input id="goalInput" type="number" value="' + goal + '" style="width:5em">' +
      '<div class="goalbar"><div style="width:' + pct + '%"></div></div>' +
      '<span class="muted">' + today + '/' + goal + '（' + pct + '%）</span></span></div>';
  }

  /* 今日新增字数：progress 接口（门禁/体检跑过才有记账）。 */
  function progToday() {
    if (!S.progress) return null;
    if (typeof S.progress.todayNew === 'number') return S.progress.todayNew;
    if (typeof S.progress.delta === 'number') return S.progress.delta;
    return null;
  }
  function todayWords() {
    var tn = progToday();
    if (tn == null) return '今天还没记录（跑一次门禁或体检就开始记账）';
    return (tn > 0 ? '+' : '') + tn + ' 字';
  }

  /* ── 本地缓存：重进面板秒开，后台静默刷新 ── */
  var CACHE_PREFIX = 'xiaoyu.cache.';
  function cacheGet(key) {
    try { var t = localStorage.getItem(CACHE_PREFIX + key); return t ? JSON.parse(t) : null; } catch (e) { return null; }
  }
  function cacheSet(key, val) {
    try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify(val)); } catch (e) {}
  }

  function tabBar() {
    $('tabs').innerHTML = TABS.map(function (t) {
      var cur = (!S.reader && !S.genEd && S.tab === t[0]) ? 'true' : 'false';
      return '<button type="button" data-tab="' + t[0] + '" aria-current="' + cur + '">' + t[1] + '</button>';
    }).join('');
  }
  function rows(pairs) {
    var out = pairs.filter(function (p) { return p && p[1] != null && String(p[1]).trim() !== ''; })
      .map(function (p) {
        return '<div class="row"><span class="k">' + esc(p[0]) + '</span><span class="v">' + esc(p[1]) + '</span></div>';
      }).join('');
    return out || '<div class="muted">（无）</div>';
  }

  /* ── 门禁批量（后台加载，章节列表/门禁页共用） ── */
  /* 门禁批量瘦身：只留面板要用的字段（heat/flags 明细现场拉单章），缓存体积小一个量级。 */
  function compactGates(d) {
    var gates = {};
    Object.keys(d.gates || {}).forEach(function (f) {
      var g = d.gates[f];
      gates[f] = (g && g.ok) ? { ok: true, human: g.human, words: g.words } : { ok: false, reason: (g && g.reason) || '?' };
    });
    return { ok: true, python: d.python, gates: gates, total: d.total, passMark: d.passMark, failed: d.failed, words: d.words, at: Date.now() };
  }
  function loadGates() {
    if (!S.ws) return;
    var ck = 'gates.' + S.ws;
    var cached = cacheGet(ck);
    if (cached && !S.gates) {
      S.gates = cached;
      if (S.tab === 'chapters' || S.tab === 'gate' || S.tab === 'overview') render();
    }
    get('gate', wsQuery()).then(function (d) {
      var c = compactGates(d);
      S.gates = c; S.gatesErr = '';
      cacheSet(ck, c);
      if (S.tab === 'chapters' || S.tab === 'gate' || S.tab === 'overview' || S.tab === 'todo' || S.reader) render();
    }).catch(function (e) { S.gatesErr = String((e && e.message) || e); });
  }

  function ensureSetup() {
    if (S.setup) return;
    get('setup', wsQuery()).then(function (d) { S.setup = d; if (S.tab === 'overview') render(); }).catch(function () { S.setup = { ok:false }; });
  }
  function loadCast(file) {
    get('chapter-cast', { path: S.ws, file: file }).then(function (d) {
      S.cast = d;
      if (S.reader && S.reader.file === file) render();
    }).catch(function () { S.cast = null; });
  }

  /* ── 概览 ── */
  /* 3.18.0 雪花法十步向导（借鉴 obsidian-snowflake-method）：每步一个框，
     存 localStorage（按工作区隔离）；十步齐了可一键打包成开书指令给 AI。 */
  var SNOW_STEPS = [
    ['一句话主线', '例：被裁员造谣的打工人觉醒谣言成真系统，靠「说什么成什么」反手打穿造谣产业链。'],
    ['一段话扩写', '五句：①背景与日常 ②打破日常的事件 ③主角的选择与新世界 ④中点反转 ⑤结局与代价。'],
    ['主要角色一句话', '主角一句 / 头号对手一句 / 情感线一句——每人都要有「要什么+缺什么」。'],
    ['主角四行卡', '目标 / 障碍 / 成长弧 / 结局下场。'],
    ['对手四行卡', '目标 / 手段 / 与主角的镜像关系 / 下场。'],
    ['配角与情感线', '每人一句：功能（递刀/递糖/递情报）+ 结局。'],
    ['一页故事', '把第2步的五句各扩成一段（每段 100-200 字）。'],
    ['角色详述', '主角与对手的完整卡：外貌/口癖/软肋/秘密。'],
    ['卷纲四段', '四段式段落划分（每段末一个中级爽点），对应 Save the Cat 的幕结构。'],
    ['章纲清单', '按段落列章：每章一行=冲突+爽点+钩子类型。']
  ];
  function snowKey() { return 'xiaoyu.snow.' + S.ws; }
  function vSnow() {
    var filled = SNOW_STEPS.filter(function (s, i) { return String(S.snow[i] || '').trim() !== ''; }).length;
    var head = '<div class="card"><h3>雪花法向导 <span class="badge">' + filled + ' / 10 步</span>' +
      '<button type="button" id="snowToggle" class="sm" style="margin-left:auto">' + (S.snowOpen ? '收起' : '展开') + '</button></h3>';
    if (!S.snowOpen) return head + '<div class="muted">十步从一句话长成整本书：一句话 → 一段话 → 角色卡 → 一页故事 → 卷纲 → 章纲。点展开逐步填。</div></div>';
    return head +
      SNOW_STEPS.map(function (s, i) {
        return '<div class="row" style="flex-direction:column;align-items:stretch"><span class="k">' + (i + 1) + '. ' + s[0] +
          '<div class="muted" style="font-size:10.5px">' + s[1] + '</div></span>' +
          '<textarea class="snowTa" data-i="' + i + '" style="width:100%;min-height:' + (i === 6 || i >= 8 ? '5em' : '2.2em') + ';font-size:12.5px">' + esc(S.snow[i] || '') + '</textarea></div>';
      }).join('') +
      '<div class="btnrow"><button type="button" id="snowCopy" class="sm pri">复制为开书指令（粘到 DSH 对话）</button>' +
      '<button type="button" id="snowClear" class="sm warn">清空</button></div>' +
      '<div class="muted">内容自动保存（按书隔离）；指令把十步打包成开书九件套的生成任务。</div></div>';
  }
  function vOverview(d) {
    var p = d.project || {}, ch = d.chapters || [], words = 0, by = {};
    ch.forEach(function (c) { words += Number(c.words || 0); var s = c.status || '未标'; by[s] = (by[s] || 0) + 1; });
    var dist = Object.keys(by).map(function (k) { return STATUS_LABEL[k] ? STATUS_LABEL[k] + ' ' + by[k] : k + ' ' + by[k]; }).join(' · ');
    var gate = '';
    if (S.gates) {
      var scored = Object.keys(S.gates.gates || {}).map(function (k) { return S.gates.gates[k]; }).filter(function (g) { return g && g.ok; });
      var avg = scored.length ? Math.round(scored.reduce(function (a, g) { return a + g.human; }, 0) / scored.length * 10) / 10 : null;
      gate = '<div class="card"><h3>门禁总览 <span class="badge">及格线 ' + esc(S.gates.passMark) + '</span></h3>' + rows([
        ['人味均值', avg == null ? '' : avg + ' 分'],
        ['不及格章', String(S.gates.failed != null ? S.gates.failed : '?') + ' / ' + (S.gates.total || 0)],
        ['总字数', S.gates.words != null ? S.gates.words + ' 字' : '']
      ]) + '</div>';
    }
    ensureSetup();
    var setupCard = '';
    if (S.setup && S.setup.items) {
      setupCard = '<div class="card"><h3>开书清单 <span class="badge">' + S.setup.done + ' / ' + S.setup.total + '</span>' +
        (S.setup.complete ? '<span class="pill good">齐了</span>' : '') + '</h3>' +
        S.setup.items.map(function (it) {
          return '<div class="row"><span class="k">' + esc(it.label) + '</span><span class="v">' +
            (it.done ? '<span class="pill good">✓</span>' : '<span class="pill bad">缺</span>') +
            (it.detail ? ' <span class="muted">' + esc(it.detail) + '</span>' : '') +
            (!it.done && it.hint ? ' <span class="muted">' + esc(it.hint) + '</span>' : '') + '</span></div>';
        }).join('') + '</div>';
    }
    var snowCard = vSnow();
    var shelf = '<div class="card"><h3>书架</h3>' + ((S.wsList || []).filter(function (w) { return w.hasNovel; }).map(function (w) {
      var cur = w.path === S.ws;
      var meta = (cur && S.data) ? '<span class="muted" style="font-size:12px">' + ((S.data.chapters || []).length) + ' 章 · ' + ((S.progress && S.progress.today) || 0) + ' 字' +
        (S.gates && gateAvg() !== '' ? ' · 人味 ' + gateAvg() : '') + '</span>' : '';
      return '<button type="button" class="wsbtn' + (cur ? ' cur' : '') + '" data-ws="' + esc(w.path) + '">' +
        esc(w.name || w.path) + (cur ? '<span class="pill good">当前</span>' : '') + '<br>' + meta + '</button>';
    }).join('') || '<div class="muted">（无）</div>') + weekBars() + '</div>';
    return setupCard + snowCard + shelf + '<div class="card"><h3>书稿</h3>' + rows([
      ['书名', p.title], ['作者', p.author], ['题材', p.genre], ['篇幅', p.length],
      ['阶段', PHASE_LABEL[p.phase] || p.phase], ['模式', MODE_LABEL[p.mode] || p.mode], ['简介', p.description]
    ]) + '</div>' +
    '<div class="card"><h3>统计</h3>' + rows([
      ['章节', ch.length + ' 章'], ['总字数', words + ' 字'], ['状态分布', dist],
      ['今日新增', todayWords()], ['本周新增', weekWords()], ['连续更新', streakDays() + ' 天'],
      ['近7日日均', dailyAvg7()], ['单日最佳', bestDay()],
      ['角色', (d.characters || []).length], ['伏笔', (d.foreshadows || []).length],
      ['关系', (d.relations || []).length], ['时间线', (d.timeline || []).length],
      ['设定', (d.world || []).length], ['线索', (d.clues || []).length], ['记忆', (d.memories || []).length]
    ]) + goalHtml() + '</div>' + gate +
    ((d.warnings || []).length ? '<div class="card"><h3>体检提示 <span class="badge">' + d.warnings.length + '</span></h3>' +
      d.warnings.map(function (w) {
        return '<div class="row"><span class="v">' + esc(typeof w === 'string' ? w : (w && w.message) || JSON.stringify(w)) + '</span></div>';
      }).join('') + '</div>' : '');
  }

  /* ── 章节 ── */
  function gatePill(file) {
    if (!S.gates || !S.gates.gates) return '';
    var g = S.gates.gates[file];
    if (!g || !g.ok) return '';
    return '<span class="pill ' + humanColor(g) + '">人味 ' + g.human + '</span>';

          : '<button type="button" class="chap" data-file="' + esc(c.file) + '">';

  /* ── 门禁总览 ── */
  function ensureTrend() {
    if (S.trend) return;
    get('trend', wsQuery()).then(function (d) { S.trend = d; if (S.tab === 'gate') render(); }).catch(function () { S.trend = { ok:false }; });
  }
  function trendSvg(rows) {
    var W = 620, H = 150, pad = 12, n = rows.length;
    if (!n) return '<div class="muted">（无数据）</div>';
    function pts(key) {
      return rows.map(function (r, i) {
        var x = pad + i * (W - 2 * pad) / Math.max(n - 1, 1);
        var y = H - pad - (Math.min(100, Number(r[key] || 0)) / 100) * (H - 2 * pad);
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' +
      '<polyline points="' + pts('human') + '" fill="none" stroke="#4b8bf5" stroke-width="2.5"/>' +
      '<polyline points="' + pts('detector') + '" fill="none" stroke="#3fbf7f" stroke-width="1.6" stroke-dasharray="5 4"/>' +
      '</svg><div class="muted">蓝=人味 · 绿=检测器 · 共 ' + n + ' 章（左→右按章节序）</div>';
  }

  function vGate() {
    ensureTrend();
    if (S.gatesErr) return '<div class="err">门禁读取失败：' + esc(S.gatesErr) + '</div>';
    if (!S.gates) return '<div class="note">正在计算门禁分…（全本逐章分析，稍等几秒）</div>';
    var names = Object.keys(S.gates.gates || {}).sort(function (a, b) {
      var ga = S.gates.gates[a], gb = S.gates.gates[b];
      return (ga && ga.ok ? ga.human : -1) - (gb && gb.ok ? gb.human : -1);
    });
    var meta = {};
    (S.data && S.data.chapters || []).forEach(function (c) { meta[c.file] = c; });
    var passRow = '<div class="row"><span class="k">及格线</span><span class="v">' +
      '<input id="pmInput" type="number" min="0" max="100" value="' + esc(S.gates.passMark) + '" style="width:5em"> ' +
      '<button type="button" id="pmSave" class="sm">保存</button></span></div>';
    var seq = (S.data && S.data.chapters || []).map(function (c) { return c.file; })
      .filter(function (f) { var g = S.gates.gates[f]; return g && g.ok; });
    var bars = '<div style="display:flex;align-items:flex-end;gap:1px;height:72px;margin:6px 0">' + seq.map(function (f) {
      var g = S.gates.gates[f];

      var bg = col === 'good' ? '#3fbf7f' : (col === 'mid' ? '#e5c063' : '#ef5b5b');
      return '<div title="' + esc((meta[f] && meta[f].title) || f) + '：' + g.human + '" style="flex:1 1 0;min-width:2px;height:' + Math.max(4, Math.round(g.human)) + '%;background:' + bg + ';border-radius:2px"></div>';
    }).join('') + '</div><div class="muted">逐章人味走势（绿≥及格线 · 黄接近 · 红不及格）</div>';
    /* 3.17.0 质检进度矩阵（借鉴 oh-story 的逐章质检记录）：
       行=章、列=检查项；门禁/定稿自动取值，一键修/读者评审/审校清单手动勾选存本地。 */
    function qcKey(f, c) { return 'qc.' + f + '.' + c; }
    var qcCols = [['gate', '门禁'], ['fix', '一键修'], ['read', '读者评审'], ['audit', '审校清单'], ['final', '定稿']];
    var chs2 = (S.data && S.data.chapters || []).slice(-25);
    var qcHtml = '<div class="card"><h3>质检进度矩阵 <span class="badge">最近 ' + chs2.length + ' 章</span></h3>' +
      '<table style="width:100%;border-collapse:collapse;font-size:12px">' +
      '<tr><th style="text-align:left;padding:3px 4px">章节</th>' + qcCols.map(function (c) { return '<th style="padding:3px 2px;font-weight:600;color:#8d939c">' + c[1] + '</th>'; }).join('') + '</tr>' +
      chs2.map(function (c) {
        var g = (S.gates.gates || {})[c.file];
        var gateCell = g && g.ok ? (g.human >= S.gates.passMark ? '<span style="color:#3fbf7f">✓ ' + g.human + '</span>' : '<span style="color:#ef5b5b">' + g.human + '</span>') : '—';
        var finalCell = c.status === 'accepted' ? '<span style="color:#3fb9f5">✓</span>' : '';
        return '<tr><td style="padding:3px 4px;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc((c.title || c.file) + '') + '</td>' +
          '<td style="text-align:center">' + gateCell + '</td>' +
          qcCols.slice(1, 4).map(function (cc) {
            var k = qcKey(c.file, cc[0]);
            return '<td style="text-align:center"><input type="checkbox" class="qcChk" data-k="' + esc(k) + '"' + (S.qcDone[k] ? ' checked' : '') + '></td>';

      '<div class="muted" style="margin-top:4px">门禁/定稿自动；一键修/读者评审/审校清单勾选存本地（走 xiaoyu-qu-ai-wei 等技能后回来勾）。</div></div>';
    return qcHtml + '<div class="card"><h3>门禁总览 <span class="badge">及格线 ' + esc(S.gates.passMark) + '</span></h3>' + rows([
      ['状态', S.gates.python === false ? 'python3 缺失，分数不可用' : '正常'],
      ['章节', (S.gates.total || 0) + ' 章'],
      ['不及格', (S.gates.failed || 0) + ' 章'],
      ['总字数', S.gates.words != null ? S.gates.words + ' 字' : ''],

    ]) + passRow + '</div>' +
    '<div class="card"><h3>人味走势</h3>' + bars + '</div>' +
    '<div class="card"><h3>全本人味历史曲线 <span class="badge">及格线 ' + esc(S.gates.passMark) + '</span></h3>' +
      (S.trend && S.trend.rows ? trendSvg(S.trend.rows) : '<div class="muted">加载中…</div>') + '</div>' +
    '<div class="card"><h3>按人味分排序（低在前）</h3>' +
    names.map(function (f) {
      var g = S.gates.gates[f], c = meta[f] || {};
      var col = humanColor(g);
      var score = g && g.ok ? '<span class="pill ' + col + '">人味 ' + g.human + '</span>' : '<span class="pill">无分（' + esc((g && g.reason) || '?') + '）</span>';
      return '<button type="button" class="chap" data-file="' + esc(f) + '">' +

    }).join('') + '</div>';
  }

  /* 3.18.0 雪花向导绑定：切换展开/收起、textarea 边打边存（不重渲染）。 */
  function bindSnow() {
    var tg = $('snowToggle');
    if (tg) tg.addEventListener('click', function () { S.snowOpen = !S.snowOpen; render(); });
    Array.prototype.forEach.call(document.querySelectorAll('.snowTa'), function (ta) {
      ta.addEventListener('input', function () {
        S.snow[Number(ta.getAttribute('data-i'))] = ta.value;
        try { localStorage.setItem(snowKey(), JSON.stringify(S.snow)); } catch (e) {}
      });
    });
    var cp = $('snowCopy');
    if (cp) cp.addEventListener('click', function () {
      var parts = [];
      SNOW_STEPS.forEach(function (s, i) {
        var v2 = String(S.snow[i] || '').trim();
        if (v2) parts.push('【' + (i + 1) + '. ' + s[0] + '】\n' + v2);
      });
      if (!parts.length) { note('十步草稿都还是空的，先填几步'); return; }
      var txt = '请按雪花法十步结果帮我开书，产出开书九件套：\n\n' + parts.join('\n\n') +
        '\n\n要求：按《小鱼创作台》的开书九件套（概览/章节/角色/伏笔/关系/时间线/设定/风格/索引板）生成对应 yml 账本内容，我粘贴回面板。';
      copy(txt).then(function (ok) { note(ok ? '开书指令已复制（' + parts.length + ' 步）' : '复制失败，手动选文本吧'); });
    });
    var cl = $('snowClear');
    if (cl) cl.addEventListener('click', function () {
      confirmAct('清空这本的十步草稿？（不可恢复）', function () {
        S.snow = {};
        try { localStorage.removeItem(snowKey()); } catch (e) {}
        render();
      });
    });
  }
  function bindGate() {
    /* 3.17.0 质检矩阵勾选：不重渲染（重渲染会丢表格），只落本地。 */
    Array.prototype.forEach.call(document.querySelectorAll('.qcChk'), function (ck) {
      ck.addEventListener('change', function () {
        S.qcDone[ck.getAttribute('data-k')] = ck.checked;
        try { localStorage.setItem('xiaoyu.qcDone', JSON.stringify(S.qcDone)); } catch (e) {}
      });
    });
    var pm = $('pmSave');
    if (pm) pm.addEventListener('click', function () {
      var v = Number(($('pmInput') || {}).value);
      if (!(v >= 0 && v <= 100)) { note('及格线要 0-100 的数字'); return; }
      postJson('gate-config', { path: S.ws, passMark: v }).then(function () {
        note('及格线已存为 ' + v); S.gates = null; loadGates();
      }).catch(function (e) { note('失败：' + ((e && e.message) || e)); });
    });
  }

  /* ── 待办工作台：体检警告 + 门禁不及格 + 伏笔悬空 汇总 ── */
  function todoKey(s) { return String(s).slice(0, 60); }
  /* 体检问题行的统一勾选键：待办页与体检页共用同一把钥匙，勾一处两边同步。 */
  function problemKey(p) {
    return todoKey((p.level === 'error' ? '错误' : '警告') + (p.file ? p.file + '：' : '') + (p.message || ''));
  }
  /* 章号引用（v02-c076）→ 排序键：跨卷可比，供伏笔到期判断用。 */
  function chapOrd(s) {
    var m = /^v(\d+)-c(\d+)$/i.exec(String(s || '').trim());
    return m ? Number(m[1]) * 1000000 + Number(m[2]) : null;
  }
  function allDone() {
    var rows = S.todoRows || [];
    return rows.length > 0 && rows.every(function (r) { return S.todoDone[todoKey(r.t + r.txt)]; });
  }
  function vTodo() {
    if (!S.check) get('check', wsQuery()).then(function (d) { S.check = d; render(); }).catch(function () { S.check = { ok:true, problems:[] }; });
    var rows = [];
    (S.gates && S.gates.gates ? Object.keys(S.gates.gates) : []).forEach(function (f) {
      var g = S.gates.gates[f];
      if (g && g.ok && g.human < S.gates.passMark) rows.push({ t: '门禁', txt: f + ' 人味 ' + g.human + '（及格线 ' + S.gates.passMark + '）', act: 'open:' + f });
    });
    ((S.check && S.check.problems) || []).forEach(function (p) {
      rows.push({ t: p.level === 'error' ? '错误' : '警告', txt: (p.file ? p.file + '：' : '') + (p.message || ''), act: '' });
    });
    /* 伏笔到期（3.11.0）：活跃伏笔的预期回收章已到/已过，自动进待办。 */
    (function () {
      var latest = 0;
      ((S.data && S.data.chapters) || []).forEach(function (c) {
        var o = chapOrd(c.file);
        if (o != null && o > latest) latest = o;
      });
      ((S.data && S.data.foreshadows) || []).forEach(function (f) {
        if (f.status === 'resolved' || f.status === 'abandoned') return;
        var er = chapOrd(f.expected_resolve);
        if (er == null || er > latest + 1) return;
        rows.push({ t: '伏笔到期', txt: f.id + '《' + (f.title || '') + '》预期回收 ' + f.expected_resolve + (er <= latest ? '（已过期未收）' : '（下一章该收）'), act: '' });
      });
    })();
    S.todoRows = rows;
    var html = rows.map(function (r) {
      var k = todoKey(r.t + r.txt);
      var done = S.todoDone[k];
      return '<div class="todorow"' + (done ? ' style="opacity:.45"' : '') + '>' +
        '<input type="checkbox" class="todoChk" data-k="' + esc(k) + '"' + (done ? ' checked' : '') + '>' +
        '<span class="pill ' + (r.t === '错误' || r.t === '门禁' ? 'bad' : 'mid') + '">' + r.t + '</span>' +
        '<span class="v">' + esc(r.txt) + '</span>' +
        (r.act.indexOf('open:') === 0 ? ' <button type="button" class="sm todoOpen" data-file="' + esc(r.act.slice(5)) + '">去处理</button>' : '') +
        '</div>';
    }).join('');
    return '<div class="card"><h3>待办 <span class="badge">' + rows.length + ' 项 · 勾选即记已处理</span>' +
      ' <button type="button" id="todoAll" class="sm">' + (allDone() ? '全不选' : '全选') + '</button>' +
      ' <button type="button" id="todoClear" class="sm" style="margin-left:auto">清除已完成</button></h3>' +
      '<div class="btnrow"><button type="button" id="todoAICopy" class="sm pri">交给小鱼处理（复制任务清单）</button>' +
      '<span class="muted">把未勾选的待办打包成指令，粘贴到 DSH 对话发给小鱼</span></div>' +
      (html || '<div class="muted ok">没有待办 ✓</div>') + '</div>';
  }
  function bindTodo() {
    var ta = $('todoAll');
    if (ta) ta.addEventListener('click', function () {
      var rows = (S.todoRows) || [];
      var allDone = rows.length > 0 && rows.every(function (r) { return S.todoDone[todoKey(r.t + r.txt)]; });
      rows.forEach(function (r) { S.todoDone[todoKey(r.t + r.txt)] = !allDone; });

          return '<div class="row"><span class="v">' + esc(String(rp.text || '').slice(0, 120)) +
            '<span class="pill">出现 ' + esc(rp.count) + ' 次</span><span class="muted"> ' + esc((rp.chapters || []).join('、')) + '</span></span></div>';
        }).join('');
      }
      if ((a.cast || []).length) {

            loadState(); loadGates();
          }).catch(function (e) { note('失败：' + ((e && e.message) || e)); });
        });
      });
    });
  }

  /* 3.16.0 角色出席矩阵（借鉴 StoryGraphs 的人物×时序网格）：
     行=角色、列=章节、格子=是否出场；一眼看出谁的戏份断档。 */
  function vCastMatrix() {
    var m = S.matrix;
    if (!m) return '<div class="card"><h3>出席矩阵</h3><div class="muted">加载中…（全书逐章扫描，首次稍慢）</div></div>';
    if (m.ok === false) return '';
    var nCh = (m.files || []).length, names = (m.names || []);
    if (!nCh || !names.length) return '';
    var CELL = 12, GAP = 2, LABEL = 88, HEAD = 26;
    var W = LABEL + nCh * (CELL + GAP), H = HEAD + names.length * (CELL + GAP);
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';
    for (var i = 0; i < nCh; i++) {
      if (i % 5 === 0) svg += '<text x="' + (LABEL + i * (CELL + GAP) + CELL / 2) + '" y="' + (HEAD - 8) + '" fill="#8d939c" font-size="8" text-anchor="middle">' + (i + 1) + '</text>';
    }
    names.forEach(function (nm, r) {
      var y = HEAD + r * (CELL + GAP);
      svg += '<text x="' + (LABEL - 4) + '" y="' + (y + CELL - 3) + '" fill="#8d939c" font-size="9" text-anchor="end">' + esc(nm.length > 7 ? nm.slice(0, 6) + '…' : nm) + '</text>';
      var cells = (m.cells && m.cells[nm]) || [];
      for (var i = 0; i < nCh; i++) {
        if (cells[i]) svg += '<rect x="' + (LABEL + i * (CELL + GAP)) + '" y="' + y + '" width="' + CELL + '" height="' + CELL + '" rx="2" fill="#4b8bf5"><title>' + esc(nm) + ' · 第' + (i + 1) + '章</title></rect>';
      }
    });
    svg += '</svg>';
    return '<div class="card"><h3>出席矩阵 <span class="badge">行=角色 · 列=章（每5章标号）</span></h3>' +
      '<div style="overflow-x:auto">' + svg + '</div>' +
      '<div class="muted" style="margin-top:4px">蓝格=该章出场。横看一行的空档=该角色戏份断档；竖看一列=该章群像规模。</div></div>';
  }
  function ensureMatrix() {
    if (S.matrix) return;
    get('cast-matrix', wsQuery()).then(function (d) { S.matrix = d; if (S.tab === 'characters') render(); }).catch(function () { S.matrix = { ok: false }; });
  }

  /* 角色出场热力：3.16.1 起优先用 cast-matrix（出场章数，秒出）；
     全书体检的提及次数版只在矩阵不可用时兜底——体检是逐章全分析，首跑慢。 */
  function vCastHeat() {
    var m = S.matrix;
    if (m && m.ok !== false && m.files && m.files.length && (m.names || []).length) {
      var nCh = m.files.length;
      var list2 = m.names.map(function (nm) {
        var cells = (m.cells && m.cells[nm]) || [];
        var cnt = 0, last = -1;
        for (var i = 0; i < cells.length; i++) { if (cells[i]) { cnt++; last = i; } }
        return { name: nm, cnt: cnt, last: last };
      }).sort(function (a, b) { return b.cnt - a.cnt; });
      var max2 = Math.max(1, list2[0] ? list2[0].cnt : 1);
      return '<div class="card"><h3>出场热力 <span class="badge">条=出场章数 · 末次出场</span></h3>' + list2.map(function (c) {
        var w = Math.round(c.cnt / max2 * 70);
        var cold = c.last >= 0 && nCh - 1 - c.last > 15;
        return '<div class="heatrow"><span style="flex:0 0 7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px">' + esc(c.name) + '</span>' +
          '<div class="heatbar" style="flex:0 0 ' + Math.max(2, w) + '%;background:' + (cold ? '#8a5a5a' : '#4b8bf5') + '"></div>' +
          '<span class="muted" style="font-size:11.5px">' + c.cnt + ' 章' + (c.last >= 0 ? ' · 末次 第' + (c.last + 1) + '章' : ' · 未出场') + (cold ? ' ⚠断档' + (nCh - 1 - c.last) + '章' : '') + '</span></div>';
      }).join('') + '</div>';
    }
    var cast = (S.audit && S.audit.cast) || null;
    if (!cast) return '<div class="card"><h3>出场热力</h3><div class="muted">矩阵与体检都还没就绪…（体检要逐章全分析，首跑较慢）</div></div>';
    var sorted = cast.slice().sort(function (a, b) { return (b.mentions || 0) - (a.mentions || 0); });
    var max = Math.max(1, sorted[0] && sorted[0].mentions || 1);
    var total = (S.data && S.data.chapters || []).length;
    return '<div class="card"><h3>出场热力 <span class="badge">条=提及次数 · 末次出场</span></h3>' + sorted.map(function (c) {
      var w = Math.round((c.mentions || 0) / max * 70);
      var lastC = chapNum(c.lastChapter);
      var cold = lastC != null && total - lastC > 15;
      return '<div class="heatrow"><span style="flex:0 0 7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px">' + esc(c.name || c.file) + '</span>' +
        '<div class="heatbar" style="flex:0 0 ' + Math.max(2, w) + '%;background:' + (cold ? '#8a5a5a' : '#4b8bf5') + '"></div>' +
        '<span class="muted" style="font-size:11.5px">' + (c.mentions || 0) + ' 次' + (c.lastChapter ? ' · 末次 ' + esc(c.lastChapter) : '') + (cold ? ' ⚠消失' + (total - lastC) + '章' : '') + '</span></div>';
    }).join('') + '</div>';
  }

  /* 3.18.0 世界观地图 & 榜单选题（最小可行版）：

  /* ── 伏笔（可改状态） ── */
  function vForeshadows(d) {
    var list = d.foreshadows || [];
    if (!list.length) return '<div class="card"><div class="muted">还没有伏笔</div></div>';
    return vForeLanes(list) + '<div class="card"><h3>伏笔 ' + list.length + ' 条</h3>' + list.map(function (f, i) {

  /* 伏笔泳道：埋设 → 期望回收 的跨章视图，悬空一眼可见。 */
  function chapNum(ref) {
    var m = /[cv](\d+)[^\d]*$/i.exec(String(ref || '')) || /(\d+)$/.exec(String(ref || ''));
    if (!m) return null;
    var n = Number(m[1]);
    return n > 200 ? n - 1000 : n; /* v02-c1074 风格归一到全局章号近似值 */
  }
  function vForeLanes(list) {
    var total = Math.max(1, (S.data && S.data.chapters || []).length);
    var last = total;
    var rows = list.map(function (f) {
      var s = chapNum(f.planted_chapter);
      var e = chapNum(f.expected_resolve || f.resolved_chapter);
      var resolved = f.status === 'resolved';
      var left = s == null ? 0 : Math.max(0, Math.min(100, s / last * 100));
      var width = (e != null ? Math.max(2, (Math.min(e, last) - (s || 0)) / last * 100) : (resolved ? 2 : Math.max(2, (last - (s || 0)) / last * 100)));
      var warn = !resolved && s != null && (last - s) > 30;
      return '<div class="lane" title="' + esc(f.title || f.content || '') + '">' +
        '<div class="lanebar" style="left:' + left + '%;width:' + width + '%;background:' + (resolved ? '#3fbf7f' : (warn ? '#ef5b5b' : '#4b8bf5')) + '"></div>' +
        '<div class="lanedot" style="left:calc(' + left + '% - 7px)"></div>' +
        '<span style="position:absolute;left:2px;top:3px;font-size:11px;color:#8d939c">' + esc((f.id || '') + ' ' + String(f.title || f.content || '').slice(0, 12)) + (warn ? ' ⚠悬空' + (last - s) + '章' : '') + '</span>' +
        '</div>';
    }).join('');
    return '<div class="card"><h3>伏笔泳道 <span class="badge">红=悬空超30章 绿=已回收</span></h3>' + rows + '</div>';
  }

  function bindFore() {

  /* ── 关系（列表 + 关系图） ── */

    var listHtml = list.map(function (r, i) {
      var dim = S.graphSel >= 0 && r.a !== names[S.graphSel] && r.b !== names[S.graphSel];
      return '<div class="row" style="' + (dim ? 'opacity:.35' : '') + '"><span class="k">' + esc(r.a) + ' — ' + esc(r.b) + '</span><span class="v">' +
        esc(r.description || '') +
        (r.type ? '<span class="pill">' + esc(r.type) + '</span>' : '') +

    }).join('');
    var chs = (S.data && S.data.chapters) || [];
    var chOpts = '<option value=""' + (S.relChap === '' ? ' selected' : '') + '>全部章节（全书关系）</option>' +
      chs.map(function (c) {
        return '<option value="' + esc(c.file) + '"' + (S.relChap === c.file ? ' selected' : '') + '>第' + esc(c.num != null ? c.num : '?') + '章 ' + esc(c.title || '') + '</option>';
      }).join('');
    var shown = S.castFilter ? list.filter(function (r) { return S.castFilter.indexOf(r.a) >= 0 && S.castFilter.indexOf(r.b) >= 0; }) : list;
    var chMeta = {};
    chs.forEach(function (c) { chMeta[c.file] = c; });
    var selBadge = S.castFilter && S.relChap ? '<span class="badge">' + esc('第' + ((chMeta[S.relChap] || {}).num || '?') + '章 ' + ((chMeta[S.relChap] || {}).title || '')) + '</span>' : '';
    return vRelMaint() + '<div class="card"><h3>关系图 ' + selBadge + '<span class="badge">点节点高亮</span></h3>' +
      '<select id="relChap" style="width:100%;margin-bottom:8px">' + chOpts + '</select>' +
      '<div class="muted" style="margin-bottom:6px">' + (S.castFilter ? '本章出场角色之间的关系 ' + shown.length + ' 条' : '全书关系 ' + list.length + ' 条') + '</div>' +
      '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px">' +
      '<button type="button" id="gFit" class="sm">适应画布</button>' +
      '<button type="button" id="gShake" class="sm">重新布局</button>' +
      '<button type="button" id="gSkel" class="sm">' + (S.graphSkel ? '骨架模式（显主要）' : '全显模式（显全部）') + '</button>' +
      '<span class="muted" style="font-size:11px;margin-left:auto">拖节点 · 空白拖动平移 · 滚轮/双指缩放 · 点节点看关系</span></div>' +
      '<div style="position:relative">' +
      '<canvas id="relcv" width="640" height="520" data-n="' + names.length + '" style="touch-action:none;width:100%;aspect-ratio:5/4;max-height:78vh;min-height:420px;display:block;border-radius:10px"></canvas></div>' +
      (S.graphSel >= 0 && names[S.graphSel] ? '<div class="muted" style="margin-top:6px">选中：' + esc(names[S.graphSel]) + '</div>' : '') +
      '</div>' + castAudit(list, names) + '<div class="card"><h3>关系 ' + list.length + ' 条</h3>' + listHtml + '</div>';
  }
  /* 3.16.0 群像结构体检（借鉴 graphify-novel 的 hub 检测思路）：
     枢纽=度数（关系边数）最高的角色；孤儿=角色卡存在但关系账零边的角色。
     零依赖：全部由已加载的 relations + characters 前端计算。 */
  function castAudit(list, relNames) {
    var deg = {};
    list.forEach(function (r) {
      [r.a, r.b].forEach(function (n) { if (n) deg[n] = (deg[n] || 0) + 1; });
    });
    var hubs = Object.keys(deg).sort(function (x, y) { return deg[y] - deg[x]; }).slice(0, 5)
      .map(function (n) { return '<span class="pill">' + esc(n) + ' · ' + deg[n] + ' 边</span>'; }).join(' ');
    var cast = (S.data && S.data.characters) || [];
    var orphanNames = [];
    cast.forEach(function (c) {
      var slug = String(c.file || '').replace(/\.md$/, '');
      if (slug && relNames.indexOf(slug) < 0) orphanNames.push(c.name || slug);
    });
    var orphanHtml = orphanNames.length
      ? '<div class="row"><span class="k">孤儿角色</span><span class="v">' + orphanNames.map(esc).join(' · ') + '</span></div>'
      : '<div class="row"><span class="k">孤儿角色</span><span class="v"><span class="pill good">无</span></span></div>';
    return '<div class="card"><h3>群像结构体检</h3>' +
      '<div class="row"><span class="k">枢纽（边数 Top）</span><span class="v">' + (hubs || '（无）') + '</span></div>' +
      orphanHtml +
      '<div class="row"><span class="k">密度</span><span class="v">' + (relNames.length ? (list.length / relNames.length).toFixed(1) : '0') + ' 条/人</span></div>' +
      '<div class="muted" style="margin-top:4px">孤儿=角色卡在建但关系账没边——要么补关系，要么这角色可能根本没戏。</div></div>';
  }
  function drawGraph() {
    var cv = $('relcv'); if (!cv) return;
    /* W/H 声明提前（3.12.6）：物理坐标尺寸的全函数作用域声明，任何引用
       它的代码（向心力/视图/种子兜底）都不许再碰提升期的 undefined。 */
    var W = 640, H = 512;
    var list = (S.data && S.data.relations) || [];
    if (S.castFilter) list = list.filter(function (r) { return S.castFilter.indexOf(r.a) >= 0 && S.castFilter.indexOf(r.b) >= 0; });
    var names = [], score = {};
    list.forEach(function (r) {
      [r.a, r.b].forEach(function (n) {
        if (!n) return;
        if (names.indexOf(n) < 0) { names.push(n); score[n] = 0; }
        score[n] += Number(r.intensity || 1);
      });
    });
    names.sort(function (x, y) { return score[y] - score[x]; });
    function tier(n) {
      var s = score[n] || 0;
      return s >= 25 ? { c: '#ff6b7d', t: '核心' } : (s >= 12 ? { c: '#ffb454', t: '重要' } : (s >= 5 ? { c: '#5cc9ff', t: '次要' } : { c: '#8891a0', t: '边缘' }));
    }
    var relStyles = [
      { k: ['敌', '仇', '恨'], c: '#ff5252', dash: [10, 6], n: '敌对' },
      { k: ['父', '母', '兄', '弟', '姐', '妹', '亲', '家'], c: '#ffb454', dash: [], n: '亲情' },
      { k: ['友', '盟', '伴', '伙'], c: '#4fd1a5', dash: [], n: '友情' },
      { k: ['恋', '爱', '情', '妻', '夫', '侣'], c: '#ff6b7d', dash: [], n: '恋情' },
      { k: ['师', '徒', '教'], c: '#b48cff', dash: [2, 7], n: '师徒' },
      { k: ['竞', '对手'], c: '#ffcc66', dash: [12, 5, 2, 5], n: '竞争' }
    ];
    function relStyle(t) {
      var s = String(t || '');
      for (var i = 0; i < relStyles.length; i++) {
        var ks = relStyles[i].k;
        for (var j = 0; j < ks.length; j++) if (s.indexOf(ks[j]) >= 0) return relStyles[i];
      }
      return { c: '#7f93ad', dash: [], n: '其他' };
    }

  /* ── 3.14.0 时间线重做：垂直轴 + 卷分组 + 首句精炼 + 折叠细节 ── */
  function tlDayNum(y) {
    var mm = /第(\d+)天/.exec(String(y || ''));
    return mm ? Number(mm[1]) : null;
  }
  function tlFirstSentence(t) {
    var s = String(t || '');

    return cut.length >= s.length ? s : cut + ' …';
  }
  function tlColor(imp) {

  }
  function vTimeline(d) {
    var list = (d.timeline || []).slice();
    if (!list.length) return '<div class="card"><div class="muted">还没有时间线</div></div>';
    list.sort(function (a, b) {
      var da = tlDayNum(a.year), db = tlDayNum(b.year);
      if (da != null && db != null) return da - db;
      if (da != null) return -1;
      if (db != null) return 1;
      var ca = chapOrd(a.chapter), cb = chapOrd(b.chapter);
      if (ca != null && cb != null) return ca - cb;
      return 0;
    });
    var groups = [], byVol = {};
    list.forEach(function (t) {
      var ch = String(t.chapter || '');
      var vol = /^v\d+/.test(ch) ? ch.slice(0, 3) : '未挂卷';
      if (!byVol[vol]) { byVol[vol] = []; groups.push(vol); }
      byVol[vol].push(t);

    var days = list.map(function (t) { return tlDayNum(t.year); }).filter(function (n) { return n != null; });
    var span = days.length ? (Math.max.apply(null, days) - Math.min.apply(null, days) + 1) : 0;
    var html = '<div class="card"><h3>时间线 <span class="badge">' + list.length + ' 事件 · ' + groups.length + ' 卷 · 故事内跨度 ' + span + ' 天</span></h3>' +
      '<input id="tlFilter" placeholder="过滤关键词（人物/事件/物件）…" style="width:100%;margin-bottom:10px">';
    groups.forEach(function (vol) {
      var items = byVol[vol];
      html += '<div class="tlVol">' + esc(vol === '未挂卷' ? '未挂卷' : '卷 ' + vol.slice(1)) + '<span class="badge">' + items.length + ' 条</span></div><div class="tl">';
      items.forEach(function (t) {

          '<div class="tlTitle">' + esc(tlFirstSentence(t.title)) + '</div>' +
          (imp ? '<div class="tlMeta"><span class="muted" style="font-size:11px">重要度</span><span style="letter-spacing:2px;color:' + tlColor(imp) + '">' + String('●●●●●').slice(0, Math.min(5, imp)) + '</span></div>' : '') +
          (desc ? '<div class="tlDesc" data-prev="' + esc(prev) + '" data-full="' + esc(desc) + '">' + esc(prev) +
            (hasDesc ? '<button type="button" class="tlMore">展开全文（' + desc.length + ' 字）</button>' : '') + '</div>' : '') +
          '</div>';

  /* ── 版本（git + 章节快照） ── */
  function ensureGit() {
    if (S.git) return;
    get('git-status', wsQuery()).then(function (d) {
      S.git = d;
      if (d.available && d.isRepo) {
        loadGitLog();
        /* 打开版本页时自动存档：距上次超过 20 小时才提交一次 */
        var last = 0;
        try { last = Number(localStorage.getItem('xiaoyu.lastAutoBak')) || 0; } catch (e) {}
        if (Date.now() - last > 20 * 3600 * 1000) {
          postJson('git-commit', { path: S.ws, message: '面板自动存档 ' + new Date().toISOString().slice(0, 16).replace('T', ' ') }).then(function () {
            try { localStorage.setItem('xiaoyu.lastAutoBak', String(Date.now())); } catch (e) {}
            S.gitLog = null; loadGitLog();
            note('已自动 git 存档');
          }).catch(function () {});
        }
      }
      render();
    }).catch(function (e) { S.git = { available:false, error: String((e && e.message) || e) }; render(); });
  }
  function loadGitLog() {
    get('git-log', { path: S.ws, limit: 30 }).then(function (d) { S.gitLog = d; render(); })
      .catch(function () { S.gitLog = { ok:false, commits:[] }; });
  }
  function vHistory() {
    ensureGit();
    var out = '<div class="card"><h3>git 书稿仓</h3>';
    if (!S.git) out += '<div class="muted">读取中…</div>';
    else if (S.git.available === false) out += '<div class="muted">环境没有 git，面板快照仍然可用（见下方章节快照）。</div>';
    else if (!S.git.isRepo) out += '<div class="btnrow"><button type="button" id="gitInit" class="sm pri">初始化 git 仓</button><span class="muted">只管 novel/ 书稿目录</span></div>';
    else {
      out += rows([
        ['分支', S.git.branch || ''], ['工作区', S.git.clean === true ? '干净' : (S.git.clean === false ? '有未提交改动' : '')],
        ['未提交', (S.git.changed || []).length ? (S.git.changed || []).join('、') : '']
      ]);
      out += '<div class="btnrow"><input id="gitMsg" placeholder="提交说明（可留空自动生成）" style="flex:1 1 12em;min-width:0">' +
        '<button type="button" id="gitCommit" class="sm pri">提交存档</button></div>';
    }
    out += '</div>';
    if (S.gitLog && (S.gitLog.commits || []).length) {
      var chs = (S.data && S.data.chapters) || [];
      var chOpts = chs.map(function (c) {
        return '<option value="' + esc(c.file) + '"' + (S.versionsFile === c.file ? ' selected' : '') + '>第' + esc(c.num != null ? c.num : '?') + '章 ' + esc(c.title || '') + '</option>';
      }).join('');
      out += '<div class="card"><h3>提交历史（回滚单章用）</h3>' +
        '<div class="row"><span class="k">选章</span><span class="v"><select id="verFile" style="width:100%">' + chOpts + '</select></span></div>' +
        S.gitLog.commits.map(function (c) {
          return '<div class="row"><span class="k">' + esc(String(c.rev || c.hash || '').slice(0, 8)) + '</span><span class="v">' +
            esc(c.subject || c.message || '') + '<span class="muted"> ' + esc((c.date || c.at || '').toString().slice(0, 19).replace('T', ' ')) + '</span> ' +
            '<button type="button" class="sm warn gitRestore" data-rev="' + esc(c.rev || c.hash) + '">回滚选中章到此版</button></span></div>';
        }).join('') + '</div>';
    }
    if (S.versions) {
      out += '<div class="card"><h3>章节快照（保存正文时自动留）</h3>';
      if (!(S.versions.versions || []).length) out += '<div class="muted">这一章还没有快照。</div>';
      else out += S.versions.versions.map(function (v) {
        return '<div class="row"><span class="k">' + esc((v.at || v.t || '').toString().slice(0, 19).replace('T', ' ')) + '</span><span class="v">' +
          esc((v.words != null ? v.words + ' 字' : '') + (v.reason ? ' · ' + v.reason : '')) + '</span></div>';
      }).join('');
      out += '</div>';
    }
    return out;
  }

  function openChapter(file, line) {

    var idx = indexOfFile(file);
    var meta = idx >= 0 ? chapterList()[idx] : null;
    S.ed = null;
    S.gateOne = null;
    S.reader = { file: file, loading: true, title: meta ? meta.title : file, body: '', status: meta && meta.status };
    render(); window.scrollTo(0, 0);
    get('chapter', { path: S.ws, file: file }).then(function (d) {
      S.reader = { file: file, loading: false, title: (meta && meta.title) || file,
        body: (d && d.body) || '', hash: (d && d.hash) || '',

  /* ── 板块折叠：每个卡片固定高度内滚 + 收起/展开 ── */
  function decorateCards() {
    Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card, idx) {
      var h = card.querySelector('h3');
      if (!h || card.getAttribute('data-dec')) return;
      card.setAttribute('data-dec', '1');
      var body = document.createElement('div');
      body.className = 'cbody';
      if (S.tab === 'characters' || S.tab === 'world') body.style.maxHeight = '34vh';
      var nodes = [];
      for (var n = h.nextSibling; n; n = n.nextSibling) nodes.push(n);
      nodes.forEach(function (nd) { body.appendChild(nd); });
      card.appendChild(body);
      var key = S.tab + '#' + idx + '#' + (h.textContent || '').slice(0, 12);
      /* 角色页默认收起；其余页默认展开。点过之后按用户的选择记忆。 */
      var htxt = (h.textContent || '').trim();
      var foldDefault = false;
      if (S.tab === 'characters') foldDefault = true;
      else if (S.reader && /^(门禁|本章出场|章纲)/.test(htxt)) foldDefault = true; /* 阅读页：门禁/出场/章纲默认收起，正文默认展开 */
      var folded = foldDefault ? S.coll[key] !== false : S.coll[key] === true;
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'foldbtn';
      btn.textContent = folded ? '▸ 展开' : '▾ 收起';
      h.appendChild(btn);
      if (folded) body.style.display = 'none';
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        S.coll[key] = !S.coll[key];
        if (S.coll[key]) { body.style.display = 'none'; btn.textContent = '▸ 展开'; }
        else { body.style.display = ''; btn.textContent = '▾ 收起'; }
      });
    });
  }

  /* ── 渲染 ── */
  function render() {
    /* 输入中防冲刷：异步 render（进度/快照/gates 回包）会重建 DOM，把正在
       输入的日更目标框连值带焦点一起冲掉，change 事件也随节点移除而丢失
       （「日更目标改不了」的根因）。先记住焦点，渲完还回去。 */
    var refocus = null;
    try { if (document.activeElement && document.activeElement.id === 'goalInput') refocus = 'goalInput'; } catch (e) {}
    tabBar();
    $('build').textContent = 'b' + BUILD;
    var v = $('view');
    if (S.err && !S.reader && !S.genEd) {
      v.innerHTML = '<div class="err">读取失败：' + esc(S.err) +
        '<div class="muted" style="margin-top:6px">点顶栏「刷新」重试。</div></div>';
      return;
    }
    if (!S.data) { v.innerHTML = '<div class="note">正在读取…</div>'; return; }
    if (S.genEd) { v.innerHTML = vGenEd(); decorateCards(); bindGenEd(); return; }
    if (S.genView) { v.innerHTML = vGenView(); decorateCards(); var ob = $('ovBack'); if (ob) ob.addEventListener('click', function () { S.genView = null; render(); }); return; }
    if (S.reader) { v.innerHTML = vReader(); decorateCards(); bindReader(); return; }
    var fns = { overview: vOverview, chapters: vChapters, gate: vGate, audit: vAudit,
                characters: vCharacters, foreshadows: vForeshadows, relations: vRelations, todo: vTodo,
                timeline: vTimeline, world: vWorld, index: vIndex, style: vStyle,
                project: vProject, search: vSearch, tools: vTools, history: vHistory };
    v.innerHTML = (fns[S.tab] || vOverview)(S.data);
    decorateCards();
    bindChapters();
    if (S.tab === 'relations') { drawGraph(); bindRelMaint(); }
    if (S.tab === 'search') bindSearch();
    if (S.tab === 'overview') bindSnow();
    if (S.tab === 'gate') bindGate();
    if (S.tab === 'audit') { bindAudit(); bindTodo(); }
    if (S.tab === 'todo') bindTodo();
    if (S.tab === 'foreshadows') bindFore();
    if (S.tab === 'timeline') bindTimeline();
    if (S.tab === 'style') bindStyle();
    if (S.tab === 'project') bindProj();
    if (S.tab === 'tools') bindTools();
    if (S.tab === 'world') bindWorldExtra();
    if (S.tab === 'history') bindHistory();
    var q = $('q');
    if (q) {
      q.addEventListener('input', function () {
        S.q = q.value;
        var pos = q.selectionStart;
        render();
        var q2 = $('q'); if (q2) { q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) {} }
      });

  }

    var spS = $('spStart');
    if (spS) spS.addEventListener('click', function () {
      var len = Math.max(5, Number(($('spLen') || {}).value) || 25);
      S.sprint = { running: true, end: Date.now() + len * 60000, base: progToday() || 0 };
      note('冲刺开始：' + len + ' 分钟，冲！');
      render();
    });
    var spX = $('spStop');
    if (spX) spX.addEventListener('click', function () { endSprint(); });
    var gi = $('goalInput');
    if (gi) {
      /* 边打字边落盘：值实时进 localStorage，任何异步 render 重建出来的输入框
         都是最新值；render 末尾的 refocus 守卫把焦点还回来，打字不中断。 */
      var saveGoal = function () {
        var g = Math.max(100, Math.round(Number(gi.value) || 4000));
        try { localStorage.setItem('xiaoyu.dailyGoal', String(g)); } catch (e) {}
      };
      gi.addEventListener('input', function () { saveGoal(); render(); });
      gi.addEventListener('change', function () { saveGoal(); render(); });
    }
  }

  function loadState() {
    if (!S.ws) { S.data = null; S.err = '没有可用的工作区'; render(); return Promise.resolve(); }
    S.err = '';
    S.gates = null; S.audit = null; S.check = null; S.style = null; S.proj = null;
    S.trash = null; S.slim = null; S.git = null; S.gitLog = null; S.versions = null;
    S.gateOne = null; S.reader = null; S.genEd = null; S.graphSel = -1; S.progress = null;
    S.setup = null; S.cast = null; S.relChap = ''; S.castFilter = null; S.dedupe = null; S.autofill = null; S.handoff = null; S.charStates = null; S.lclean = null; S.searchRes = null;
    get('progress', wsQuery()).then(function (d) {
      S.progress = d;
      var sess = null;
      try { sess = JSON.parse(localStorage.getItem('xiaoyu.sess') || 'null'); } catch (e) {}
      if (!sess || Date.now() - sess.start > 6 * 3600 * 1000) {
        sess = { start: Date.now(), base: (d && (typeof d.todayNew === 'number' ? d.todayNew : (typeof d.delta === 'number' ? d.delta : 0))) || 0 };
        try { localStorage.setItem('xiaoyu.sess', JSON.stringify(sess)); } catch (e) {}
      }
      S.sess = sess;
      if (S.tab === 'overview') render();
    }).catch(function () {});
    var ck = 'state.' + S.ws;
    var cached = cacheGet(ck);
    if (cached && !S.data) {
      S.data = cached;
      render();
      loadGates();
    }
    return get('state', { path: S.ws }).then(function (d) {
      if (!d || d.ok === false) {
        if (!cached) { S.data = null; S.err = (d && d.error) || '状态快照为空'; }
      } else {
        S.data = d;
        cacheSet(ck, d);
      }
      render();
      loadGates();
    }).catch(function (e) {
      if (!cached) { S.data = null; S.err = String((e && e.message) || e); }
      render();
    });
  }

  function boot() {
    $('build').textContent = 'b' + BUILD;
    get('workspaces').then(function (d) {
      var list = (d && d.workspaces) || [];
      S.wsList = list;
      var sel = $('ws');
      sel.innerHTML = list.map(function (w, i) {
        return '<option value="' + esc(w.path) + '"' + (w.hasNovel ? '' : ' disabled') + '>' +
          esc((w.name || w.path || ('工作区' + (i + 1))) + (w.hasNovel ? '' : '（无 novel）')) + '</option>';
      }).join('') || '<option value="">（无工作区）</option>';
      var usable = list.filter(function (w) { return w.hasNovel; });
      if (!usable.length) { S.err = '没有任何含 novel/ 的工作区。'; render(); return; }
      var saved = '';
      try { saved = localStorage.getItem('xiaoyu.ws.panel') || ''; } catch (e) {}
      S.ws = (saved && usable.some(function (w) { return w.path === saved; })) ? saved : usable[0].path;
      sel.value = S.ws;
      return loadState();
    }).catch(function (e) { S.err = String((e && e.message) || e); render(); });

    get('update-check').then(function (d) {
      if (d && d.current) $('build').title = '服务端 v' + d.current + ' · 页面 b' + BUILD;
    }).catch(function () {});
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (t && t.getAttribute && t.getAttribute('data-tab')) {
      S.tab = t.getAttribute('data-tab'); S.reader = null; S.genEd = null; S.graphSel = -1; render(); window.scrollTo(0, 0);
    }
  });
  $('ws').addEventListener('change', function () {
    S.ws = $('ws').value;
    try { localStorage.setItem('xiaoyu.ws.panel', S.ws); } catch (e) {}
    loadState();
  });
  $('btnReload').addEventListener('click', function () {
    note('正在重新读取…');
    loadState().then(function () { note('已刷新 ' + new Date().toLocaleTimeString()); });
  });
  function upmsg(t) { var el = $('upmsg'); if (el) el.textContent = t || ''; }
  function upmsgHtml(h) { var el = $('upmsg'); if (el) el.innerHTML = h; }
  /* 一键自更新（3.7.3）：检测到新版本后顶栏直接出「立即更新」。 */
  function doSelfUpdate(report) {
    askModal('从 GitHub 下载并安装最新版？\n更新完成后需要重启 App 才生效。', function () {
      var holder = document.getElementById('upmsg');
      var wrap = document.createElement('span');
      wrap.className = 'updwrap';
      var bar = document.createElement('div');
      bar.className = 'updbar';
      var fill = document.createElement('div');
      bar.appendChild(fill); wrap.appendChild(bar); wrap.appendChild(document.createTextNode(''));
      var txt = document.createElement('span');
      txt.className = 'muted'; txt.style.fontSize = '11px';
      wrap.appendChild(txt);
      if (holder) { holder.innerHTML = ''; holder.appendChild(wrap); }
      var p = 5;
      fill.style.width = p + '%';
      var timer = setInterval(function () {
        p = Math.min(92, p + (95 - p) * 0.18);
        fill.style.width = p + '%';
        txt.textContent = Math.round(p) + '%';
      }, 500);
      function done(msg) {
        clearInterval(timer);
        fill.style.width = '100%';
        txt.textContent = '完成';
        setTimeout(function () { upmsg(msg); }, 1600);
      }
      function fail(msg) {
        clearInterval(timer);
        upmsg(msg);
      }
      postJson('self-update', {}).then(function (d) {
        if (d && d.ok) done('更新完成：v' + (d.to || d.tag || '?') + ' —— 重启 App 后生效');
        else fail('没有更新：' + ((d && d.error) || (d && d.kind) || '未知原因'));
      }).catch(function (e) { fail('更新失败：' + ((e && e.message) || e)); });
    }, '立即更新');
  }
  $('btnCheck').addEventListener('click', function () {
    upmsg('正在检测更新…');
    fetch(API + 'update-check?fresh=1').then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.updateAvailable) {
        upmsgHtml('有新版本 v' + esc(d.latest) + '（当前 v' + esc(d.current) + '） <button type="button" id="upNow" class="sm pri">立即更新</button>');
        var un = $('upNow');
        if (un) un.addEventListener('click', function () { doSelfUpdate(upmsg); });
      }
      else if (d && d.error) upmsg('检测失败：' + d.error);
      else upmsg('已是最新（v' + ((d && d.current) || '?') + ' · ' + new Date().toLocaleTimeString() + '）');
    }).catch(function (e) { upmsg('检测失败：' + ((e && e.message) || e)); });
  });
  function applyTheme(light) {
    document.body.className = light ? 'light' : '';
    try { localStorage.setItem('xiaoyu.theme', light ? 'light' : 'dark'); } catch (e) {}
  }
  var savedTheme = '';
  try { savedTheme = localStorage.getItem('xiaoyu.theme') || ''; } catch (e) {}
  if (savedTheme === 'light') applyTheme(true);
  try { S.fontScale = Number(localStorage.getItem('xiaoyu.fontScale')) || 1; } catch (e) {}
  try { S.qcDone = JSON.parse(localStorage.getItem('xiaoyu.qcDone') || '{}') || {}; } catch (e) {}
  try { S.snow = JSON.parse(localStorage.getItem(snowKey()) || '{}') || {}; } catch (e) {}
  try { S.graphZoom = Number(localStorage.getItem('xiaoyu.graphZoom')) || 1; } catch (e) {}
  try { S.todoDone = JSON.parse(localStorage.getItem('xiaoyu.todoDone') || '{}') || {}; } catch (e) {}
  $('btnTheme').addEventListener('click', function () {
    applyTheme(document.body.className !== 'light');
  });
  $('btnDiag').addEventListener('click', function () {
    var payload = { tag: 'standalone-panel', build: BUILD, shellBranch: 'standalone',
      ua: String(navigator.userAgent || '').slice(0, 200), vw: innerWidth, vh: innerHeight,
      standalone: { ws: S.ws, tab: S.tab, hasData: !!S.data,
        chapters: chapterList().length, err: S.err, reading: !!(S.reader && S.reader.file) } };
    try { fetch(API + 'client-diag', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload), keepalive: true }); } catch (e) {}
    upmsg('自检已发送（服务端 xiaoyu-diag.log）');
  });

  function endSprint(done) {
    var sp = S.sprint;
    S.sprint = null;
    if (!sp) { render(); return; }
    var gain = Math.max(0, (progToday() || 0) - sp.base);
    if (done) note('冲完了！这一波 ' + gain + ' 字，休息五分钟吧 🌸');
    else note('冲刺结束：' + gain + ' 字');
    render();
  }
  setInterval(function () {
    var el = $('sessTime');
    if (el && S.sess) el.textContent = Math.max(0, Math.floor((Date.now() - S.sess.start) / 60000));
    var spc = $('spClock');
    if (spc && S.sprint && S.sprint.running) {
      var left = Math.max(0, Math.ceil((S.sprint.end - Date.now()) / 1000));
      spc.textContent = Math.floor(left / 60) + ':' + (left % 60 < 10 ? '0' : '') + (left % 60);
      if (left <= 0) endSprint(true);
    }
  }, 1000);
  function pingOnline() {
    fetch(API + 'update-check').then(function () {
      var o = document.getElementById('offline');
      if (o) o.style.display = 'none';
    }).catch(function () {
      var o = document.getElementById('offline');
      if (o) o.style.display = '';
    });
  }
  setInterval(pingOnline, 15000);
  render();
  boot();
})();
</script></body></html>
